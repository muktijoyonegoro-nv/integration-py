[project]
name = "integration-py"
version = "0.1.0"
description = "Multi-Repo Integration Testing Platform for Ninja Van microservices"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "docker>=7.1.0",
    "testcontainers>=4.4.0",
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
    "redis>=5.0.4",
    "confluent-kafka>=2.4.0",
    "protobuf>=5.26.1",
    "grpcio-tools>=1.62.2",
    "httpx>=0.27.0",
    "psutil>=5.9.8",
    "tenacity>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-timeout>=2.3.1",
    "pytest-subtests>=0.12.1",
    "pytest-xdist>=3.6.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-pyyaml>=6.0.12",
    "types-redis>=4.6.0",
    "types-psutil>=5.9.5",
]

[project.scripts]
test-runner = "harness.runner.cli:main"
pull-images = "harness.runner.cli:pull_images_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness", "proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "proto"]
addopts = "-v --tb=short"
timeout = 900
markers = [
    "sort_mistake: Contract tests for sort-mistake service",
    "sort_service: Contract tests for sort-service service",
    "producer: Producer-isolated contract tests",
    "consumer: Consumer-isolated contract tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
