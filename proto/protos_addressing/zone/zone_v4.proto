syntax = "proto3";

package proto.model.zone;

option java_package = "co.ninjavan.protos.addressing.zone";
option java_outer_classname = "ZoneV4Proto";
option go_package = "bitbucket.ninjavan.co/ad/addressing-protos/go/zone";

import "zone/geobuf.proto";
import "zone/zone_event.proto";

message ZoneV4 {
    int64 id = 1;
    int64 legacy_zone_id = 2;
    SystemId system_id = 3;
    string name = 4;
    ZoneType type = 5;
    int64 hub_id = 6;
    string short_name = 7;
    string description = 8;
    double latitude = 9;
    double longitude = 10;
    Data polygon = 11;
    optional string tag_name = 12;
    repeated int64 shipper_ids = 13;
}
