syntax = "proto3";

package protos.commons.common;

option java_package = "co.ninjavan.protos.commons";
option go_package = "bitbucket.ninjavan.co/protos/proto-commons/go/common";
option java_outer_classname = "MetadataProto";

message Metadata {

    string system_id       = 1;
    int64  timestamp       = 2;

    int32  user_id         = 3;
    string user_grant_type = 4;
    string user_email      = 5;
    string user_name       = 6;

    string request_id      = 7;

}
